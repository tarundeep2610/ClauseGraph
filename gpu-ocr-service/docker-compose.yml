version: "3.9"

services:
  # This box is a SHARED machine — a separate, unrelated project ("itender"'s
  # RokkaAI service) already runs here and uses Tailscale at the Windows-host
  # level (one interactive GUI login, no authkey, giving the whole Windows
  # host a single tailscale0 identity/IP). This stack deliberately does NOT
  # run its own Tailscale client/container — a second containerized Tailscale
  # node logging into the same tailnet account from the same physical machine
  # was redundant, and was the actual cause of a Windows Firewall
  # network-profile issue that previously forced a public-IP workaround (see
  # DEPLOYMENT.md). Instead, this stack reuses the host's existing Tailscale
  # identity implicitly: gpu-proxy below is published via a normal Docker
  # "ports:" mapping, and Docker Desktop's WSL2 port-publish bridge binds
  # that to ALL host interfaces (0.0.0.0) — including tailscale0 — not just
  # LAN/WAN. That's the same pattern already proven to work for
  # rokkaai-app:11600 on this same host.
  #
  # On Docker Desktop for Windows, containers run inside a WSL2 VM — inbound
  # reachability from OUTSIDE that VM (including from a Tailscale peer)
  # depends on Docker Desktop's own port-publish bridge, which only activates
  # for an explicit "ports:" mapping.
  #
  # NOTE: binding to the Tailscale IP specifically (rather than 0.0.0.0) is
  # NOT possible here — that IP lives at the Windows-host level, and the
  # WSL2 port-publish bridge can't be scoped to it. Publishing on 0.0.0.0
  # means this port is technically reachable from the regular LAN/WAN too,
  # not just the tailnet — the shared-secret check in Caddyfile is what
  # actually protects it at that point, not network isolation alone (same
  # tradeoff already accepted for rokkaai-app:11600). See DEPLOYMENT.md for
  # an optional Windows Firewall RemoteAddress-scoping hardening step.

  ollama:
    image: ollama/ollama:latest
    environment:
      # Must bind all interfaces now: Caddy reaches this over the compose
      # default network via container DNS ("ollama"), not a shared network
      # namespace/loopback. This service still has no "ports:" entry, so
      # it remains unreachable from the Windows host, LAN, or tailnet
      # directly — only from other containers in this compose project.
      - OLLAMA_HOST=0.0.0.0:11434
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  # Single external entry point for the whole box — only port 11610 is
  # available on this machine, so gpu-ocr-api and Ollama share it here,
  # routed by path (see Caddyfile). Neither service needs its own port.
  gpu-proxy:
    image: caddy:2-alpine
    depends_on: [ollama, gpu-ocr-api]
    environment:
      - GPU_OCR_SHARED_SECRET=${GPU_OCR_SHARED_SECRET}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "0.0.0.0:11610:11610"
    restart: unless-stopped

  gpu-ocr-api:
    image: ocr-gpu-api:latest
    build: .
    environment:
      - GPU_OCR_SHARED_SECRET=${GPU_OCR_SHARED_SECRET}
      - GPU_OCR_MAX_CONCURRENT_JOBS=${GPU_OCR_MAX_CONCURRENT_JOBS:-2}
      - UNLIMITED_OCR_ALLOW_REMOTE_CODE=1
      - UNLIMITED_OCR_MODEL_REVISION=${UNLIMITED_OCR_MODEL_REVISION:-main}
      - HF_HOME=/app/hf_cache
      # hf_xet's chunked transfer protocol stalls/retries indefinitely on
      # unstable or restricted networks ("connection struggling" in the xet
      # log) — force the plain HTTPS downloader instead, which is far more
      # tolerant of flaky connections.
      - HF_HUB_DISABLE_XET=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - hf_cache:/app/hf_cache
    # No "ports:" entry — gpu-ocr-api is reachable ONLY from other
    # containers in this compose project (i.e. gpu-proxy), via the compose
    # default network's service-name DNS ("gpu-ocr-api"). Never published
    # to the host.
    restart: unless-stopped

volumes:
  ollama_data:
  hf_cache:
