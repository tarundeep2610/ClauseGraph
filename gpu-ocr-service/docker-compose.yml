version: "3.9"

services:
  tailscale:
    image: tailscale/tailscale:latest
    hostname: ocr-gpu
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_EXTRA_ARGS=--advertise-tags=tag:ocr-gpu
      - TS_STATE_DIR=/var/lib/tailscale
    volumes:
      - tailscale-state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add: [NET_ADMIN, NET_RAW]
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    network_mode: "service:tailscale"
    depends_on: [tailscale]
    environment:
      # Bound to loopback only — never reachable via the tailscale0 interface.
      # The only path to Ollama from off-box is through the Caddy proxy below,
      # which enforces the shared-secret check Ollama itself has no hook for.
      - OLLAMA_HOST=127.0.0.1:11434
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  # Single external entry point for the whole box — only port 11610 is
  # available on this machine, so gpu-ocr-api and Ollama share it here,
  # routed by path (see Caddyfile). Neither service needs its own port.
  gpu-proxy:
    image: caddy:2-alpine
    network_mode: "service:tailscale"
    depends_on: [tailscale, ollama, gpu-ocr-api]
    environment:
      - GPU_OCR_SHARED_SECRET=${GPU_OCR_SHARED_SECRET}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    restart: unless-stopped

  gpu-ocr-api:
    image: ocr-gpu-api:latest
    build: .
    network_mode: "service:tailscale"
    depends_on: [tailscale]
    environment:
      - GPU_OCR_SHARED_SECRET=${GPU_OCR_SHARED_SECRET}
      - GPU_OCR_MAX_CONCURRENT_JOBS=${GPU_OCR_MAX_CONCURRENT_JOBS:-2}
      - UNLIMITED_OCR_ALLOW_REMOTE_CODE=1
      - UNLIMITED_OCR_MODEL_REVISION=${UNLIMITED_OCR_MODEL_REVISION:-main}
      - HF_HOME=/app/hf_cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - hf_cache:/app/hf_cache
    # No "ports:" entry — gpu-ocr-api is reachable ONLY through the
    # tailscale0 interface inside the shared network namespace above.
    restart: unless-stopped

volumes:
  tailscale-state:
  ollama_data:
  hf_cache:
