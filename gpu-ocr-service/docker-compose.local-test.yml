version: "3.9"

# LOCAL TEST ONLY — for running the GPU OCR service in CPU-fallback mode on
# a dev machine with no GPU, alongside ../docker-compose.local-test.yml
# running the CPU app. See ../run-local-test.ps1 and DEPLOYMENT.md's "Local
# testing without a GPU" section. The prod file is docker-compose.yml — this
# is identical to it except gpu-ocr-api has no GPU device reservation.
#
# NOTE: unlike the prod docker-compose.yml, this file DOES still run its own
# tailscale sidecar. That's intentional — this file is meant for a personal
# dev machine with no pre-existing host-level Tailscale login to conflict
# with, so the "two Tailscale clients on one box" problem that prod's
# docker-compose.yml was changed to avoid doesn't apply here. Don't copy
# prod's tailscale-less pattern into this file unless this file also starts
# running on a shared/conflicting host. Because this file keeps the shared
# network namespace (and "localhost" upstreams), it uses its own
# Caddyfile.local-test instead of the shared Caddyfile prod now uses.

services:
  tailscale:
    image: tailscale/tailscale:latest
    hostname: ocr-gpu
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_EXTRA_ARGS=--advertise-tags=tag:ocr-gpu
      - TS_STATE_DIR=/var/lib/tailscale
    volumes:
      - tailscale-state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add: [NET_ADMIN, NET_RAW]
    ports:
      - "11610:11610"
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    network_mode: "service:tailscale"
    depends_on: [tailscale]
    environment:
      - OLLAMA_HOST=127.0.0.1:11434
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  gpu-proxy:
    image: caddy:2-alpine
    network_mode: "service:tailscale"
    depends_on: [tailscale, ollama, gpu-ocr-api]
    environment:
      - GPU_OCR_SHARED_SECRET=${GPU_OCR_SHARED_SECRET}
    volumes:
      - ./Caddyfile.local-test:/etc/caddy/Caddyfile:ro
    restart: unless-stopped

  gpu-ocr-api:
    image: ocr-gpu-api:latest
    build: .
    network_mode: "service:tailscale"
    depends_on: [tailscale]
    environment:
      - GPU_OCR_SHARED_SECRET=${GPU_OCR_SHARED_SECRET}
      # Kept at 1 here — CPU inference for one page already uses most of
      # this box's memory/CPU; a second concurrent page risks an OOM-kill.
      - GPU_OCR_MAX_CONCURRENT_JOBS=${GPU_OCR_MAX_CONCURRENT_JOBS:-1}
      - UNLIMITED_OCR_ALLOW_REMOTE_CODE=1
      - UNLIMITED_OCR_MODEL_REVISION=${UNLIMITED_OCR_MODEL_REVISION:-main}
      - HF_HOME=/app/hf_cache
      # hf_xet's chunked transfer protocol stalls/retries indefinitely on
      # unstable or restricted networks ("connection struggling" in the xet
      # log) — force the plain HTTPS downloader instead, which is far more
      # tolerant of flaky connections.
      - HF_HUB_DISABLE_XET=1
      # TEMPORARY — for the PDF-overlay coordinate-space spike; captures the
      # raw pre-strip <|det|> tag output to ./latest_ocr_result_raw.md inside
      # this container (docker exec in to read it). Safe to remove afterwards.
      - UNLIMITED_OCR_SAVE_DEBUG_FILES=1
    # No GPU reservation — runs on CPU. unlimited_ocr_engine.py already
    # detects torch.cuda.is_available()==False and falls back to CPU/float32.
    volumes:
      - hf_cache:/app/hf_cache
    restart: unless-stopped

volumes:
  tailscale-state:
  ollama_data:
  hf_cache:
