version: "3.9"

services:
  # The CPU server itself must stay reachable on the public internet (for the
  # browser UI and integrating projects), so — unlike the GPU box — this
  # sidecar does NOT restrict glm-ocr-api's public port. Tailscale here exists
  # only to give glm-ocr-api an egress path to reach the GPU server's
  # tailnet-only address; the host port mapping below is declared on this
  # service (not on glm-ocr-api) because it owns the shared network namespace.
  tailscale:
    image: tailscale/tailscale:latest
    hostname: ocr-cpu
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_EXTRA_ARGS=--advertise-tags=tag:ocr-cpu
      - TS_STATE_DIR=/var/lib/tailscale
    volumes:
      - tailscale-state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add: [NET_ADMIN, NET_RAW]
    ports:
      # 12006 is this deployment's designated public port for the OCR service
      # (matching this org's existing per-service port convention). Change the
      # bind address to 127.0.0.1 instead if you're fronting this with your
      # own reverse proxy/TLS terminator rather than exposing it directly.
      - "12006:8000"
    restart: unless-stopped

  glm-ocr-api:
    image: ocr-cpu-glm-api:latest
    build: .
    network_mode: "service:tailscale"
    depends_on: [tailscale]
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - RENDER_SCALE=1.5
      - OCR_TIMEOUT_SECONDS=600
      # How many pages this CPU service submits to the GPU service at once.
      - OCR_JOB_CONCURRENCY=${OCR_JOB_CONCURRENCY:-2}
      - DATA_DIR=/app/data
      # GPU server — reached over the tailnet, see DEPLOYMENT.md
      - GPU_OCR_BASE_URL=${GPU_OCR_BASE_URL:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-}
      - GPU_OCR_SHARED_SECRET=${GPU_OCR_SHARED_SECRET:-}
      - GPU_OCR_CONNECT_TIMEOUT_SECONDS=${GPU_OCR_CONNECT_TIMEOUT_SECONDS:-10}
      - GPU_OCR_POLL_INTERVAL_SECONDS=${GPU_OCR_POLL_INTERVAL_SECONDS:-3}
      # Client-side liveness safety net only (NOT a per-page timeout - that's
      # OCR_TIMEOUT_SECONDS above, enforced by the GPU service itself). See
      # config.py's comment for why this must stay decoupled from it.
      - GPU_OCR_CLIENT_SAFETY_TIMEOUT_SECONDS=${GPU_OCR_CLIENT_SAFETY_TIMEOUT_SECONDS:-1800}
      - OCR_LOCAL_ENGINE=${OCR_LOCAL_ENGINE:-false}
      # AuthNexus SSO — see DEPLOYMENT.md for how to obtain these
      - AUTH_AUTHORITY=${AUTH_AUTHORITY:-}
      - PROJECT_ID=${PROJECT_ID:-}
      - ORG_ID=${ORG_ID:-}
      - CLIENT_ID=${CLIENT_ID:-}
      - DEV_MODE=${DEV_MODE:-false}
      - DEV_SECRET=${DEV_SECRET:-}
      # AI-assisted document-structure indexing — see ai_indexing/credentials.py.
      # Read live from these vars only; never stored in the database.
      - AI_INDEX_PROVIDER=${AI_INDEX_PROVIDER:-gemini}
      - AI_INDEX_MODEL=${AI_INDEX_MODEL:-gemini-2.5-flash}
      - AI_INDEX_BASE_URL=${AI_INDEX_BASE_URL:-}
      - AI_INDEX_API_KEY=${AI_INDEX_API_KEY:-}
    volumes:
      # Persists SQLite database and uploaded document files across container restarts
      - ocr_data:/app/data

volumes:
  tailscale-state:
  ocr_data:
